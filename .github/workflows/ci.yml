name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: nci
      # storybook プロジェクトは Chromium 実機で走るのでバイナリを先に入れる
      - name: Install Playwright browser
        working-directory: apps/web
        run: na exec playwright install --with-deps chromium
      - run: nr lint
      - run: nr typecheck
      - run: nr test
      - run: nr build
      - run: nr build-storybook
      - run: nr knip

  # ci とは独立させる。lint の失敗を待ってから E2E が動くとフィードバックが遅い。
  # D1 はローカル（miniflare）なので services コンテナは要らない
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: nci

      - name: Install Playwright browser
        working-directory: apps/web
        run: na exec playwright install --with-deps chromium

      # ここで nr build しないのは、web のビルドを playwright の webServer が
      # E2E 用の VITE_API_URL 付きで行うため
      - name: Run E2E tests
        working-directory: apps/web
        run: nr test:e2e

      - uses: actions/upload-artifact@v4
        # failure() だと flaky（retry で通った）ケースの trace が取れない
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # 別ワークフローに分けると needs が使えず workflow_run 越しになる。
  # 検証ステップを両方で二重に回すことになるのでここに同居させている
  deploy-api:
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: nci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          command: deploy --env production

  deploy-web:
    needs: [deploy-api]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # 空でも本番は同一オリジンで動いてしまうので、ここで落とさないと
      # 設定漏れに気づけない。install より前に置いて即座に失敗させる
      - name: VITE_API_URL が設定されているか確認
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Actions Variables に VITE_API_URL がありません（Settings → Secrets and variables → Actions → Variables）"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: nci
      # apps/web/.env.production は gitignore なのでランナー上に無い。
      # 本番 URL はここから渡す（秘密ではないので secrets ではなく vars）
      - run: nlx turbo run build --filter=@placeastro/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/web
          command: deploy --env production
