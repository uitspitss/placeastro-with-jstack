name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run test
      - run: pnpm turbo run build
      - run: pnpm knip
