name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: nci
      # storybook プロジェクトは Chromium 実機で走るのでバイナリを先に入れる
      - name: Install Playwright browser
        working-directory: apps/web
        run: na exec playwright install --with-deps chromium
      - run: nr lint
      - run: nr typecheck
      - run: nr test
      - run: nr build
      - run: nr build-storybook
      - run: nr knip

  # ci とは独立させる。lint の失敗を待ってから E2E が動くとフィードバックが遅い。
  # D1 はローカル（miniflare）なので services コンテナは要らない
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: nci

      - name: Install Playwright browser
        working-directory: apps/web
        run: na exec playwright install --with-deps chromium

      # ここで nr build しないのは、web のビルドを playwright の webServer が
      # E2E 用の VITE_API_URL 付きで行うため
      - name: Run E2E tests
        working-directory: apps/web
        run: nr test:e2e

      - uses: actions/upload-artifact@v4
        # failure() だと flaky（retry で通った）ケースの trace が取れない
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
