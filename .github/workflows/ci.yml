name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: nci
      - run: nr lint
      - run: nr typecheck
      - run: nr test
      - run: nr build
      - run: nr knip
