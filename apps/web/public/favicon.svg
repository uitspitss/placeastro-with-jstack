<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="hsl(222, 50%, 7%)"/>
      <stop offset="100%" stop-color="hsl(222, 55%, 2%)"/>
    </radialGradient>

    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(38, 80%, 85%)" stop-opacity="1"/>
      <stop offset="25%" stop-color="hsl(36, 72%, 65%)" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="hsl(36, 72%, 54%)" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="hsl(36, 72%, 54%)" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(36, 72%, 54%)" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="hsl(36, 72%, 54%)" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaGlow" cx="30%" cy="70%" r="65%">
      <stop offset="0%" stop-color="hsl(36, 72%, 54%)" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="hsl(36, 72%, 54%)" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="roundClip">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">
    <!-- Deep space background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#nebulaGlow)"/>

    <!-- Telescope reticle: outer field of view -->
    <circle cx="256" cy="256" r="192" fill="none" stroke="hsl(220, 20%, 20%)" stroke-width="1.2" opacity="0.45"/>

    <!-- Inner calibration ring -->
    <circle cx="256" cy="256" r="118" fill="none" stroke="hsl(220, 20%, 18%)" stroke-width="0.8" opacity="0.3"/>

    <!-- Crosshair lines with gap at center -->
    <line x1="256" y1="54" x2="256" y2="200" stroke="hsl(220, 20%, 20%)" stroke-width="0.8" opacity="0.25"/>
    <line x1="256" y1="312" x2="256" y2="458" stroke="hsl(220, 20%, 20%)" stroke-width="0.8" opacity="0.25"/>
    <line x1="54" y1="256" x2="200" y2="256" stroke="hsl(220, 20%, 20%)" stroke-width="0.8" opacity="0.25"/>
    <line x1="312" y1="256" x2="458" y2="256" stroke="hsl(220, 20%, 20%)" stroke-width="0.8" opacity="0.25"/>

    <!-- Tick marks -->
    <line x1="253" y1="138" x2="259" y2="138" stroke="hsl(220, 20%, 25%)" stroke-width="0.7" opacity="0.35"/>
    <line x1="253" y1="374" x2="259" y2="374" stroke="hsl(220, 20%, 25%)" stroke-width="0.7" opacity="0.35"/>
    <line x1="138" y1="253" x2="138" y2="259" stroke="hsl(220, 20%, 25%)" stroke-width="0.7" opacity="0.35"/>
    <line x1="374" y1="253" x2="374" y2="259" stroke="hsl(220, 20%, 25%)" stroke-width="0.7" opacity="0.35"/>

    <!-- Background stars -->
    <circle cx="118" cy="108" r="1.4" fill="hsl(220, 20%, 68%)" opacity="0.45"/>
    <circle cx="392" cy="138" r="1.1" fill="hsl(36, 50%, 68%)" opacity="0.35"/>
    <circle cx="148" cy="382" r="1.6" fill="hsl(220, 20%, 72%)" opacity="0.4"/>
    <circle cx="402" cy="358" r="1.2" fill="hsl(220, 20%, 62%)" opacity="0.3"/>
    <circle cx="338" cy="418" r="0.9" fill="hsl(36, 55%, 62%)" opacity="0.25"/>
    <circle cx="98" cy="248" r="1.3" fill="hsl(220, 20%, 70%)" opacity="0.35"/>
    <circle cx="418" cy="228" r="1.0" fill="hsl(220, 20%, 66%)" opacity="0.3"/>
    <circle cx="198" cy="128" r="0.9" fill="hsl(36, 40%, 66%)" opacity="0.25"/>
    <circle cx="308" cy="98" r="1.5" fill="hsl(220, 20%, 72%)" opacity="0.4"/>
    <circle cx="178" cy="428" r="1.1" fill="hsl(220, 20%, 64%)" opacity="0.25"/>
    <circle cx="78" cy="168" r="0.8" fill="hsl(36, 45%, 70%)" opacity="0.25"/>
    <circle cx="428" cy="88" r="0.9" fill="hsl(220, 20%, 68%)" opacity="0.3"/>
    <circle cx="360" cy="180" r="0.7" fill="hsl(220, 20%, 60%)" opacity="0.2"/>
    <circle cx="140" cy="290" r="1.0" fill="hsl(220, 20%, 65%)" opacity="0.3"/>

    <!-- Diffraction spikes: 4-point, amber -->
    <line x1="256" y1="168" x2="256" y2="344" stroke="hsl(36, 72%, 58%)" stroke-width="1.8" opacity="0.45"/>
    <line x1="168" y1="256" x2="344" y2="256" stroke="hsl(36, 72%, 58%)" stroke-width="1.8" opacity="0.45"/>

    <!-- Secondary diagonal spikes -->
    <line x1="204" y1="204" x2="308" y2="308" stroke="hsl(36, 72%, 56%)" stroke-width="0.7" opacity="0.18"/>
    <line x1="308" y1="204" x2="204" y2="308" stroke="hsl(36, 72%, 56%)" stroke-width="0.7" opacity="0.18"/>

    <!-- Outer star glow -->
    <circle cx="256" cy="256" r="56" fill="url(#outerGlow)"/>

    <!-- Star glow -->
    <circle cx="256" cy="256" r="36" fill="url(#starGlow)"/>

    <!-- Star core -->
    <circle cx="256" cy="256" r="14" fill="hsl(36, 75%, 72%)"/>
    <circle cx="256" cy="256" r="7" fill="hsl(40, 85%, 90%)"/>
    <circle cx="256" cy="256" r="3" fill="hsl(42, 90%, 97%)"/>

    <!-- Catalog notation -->
    <text x="84" y="460" font-family="ui-monospace, 'SF Mono', 'Menlo', monospace" font-size="26" font-weight="400" fill="hsl(36, 72%, 54%)" opacity="0.28" letter-spacing="1.5">M</text>
  </g>
</svg>
