# Wrangler configuration for development
# Production settings should be in wrangler.jsonc

name = "placeastro-api-dev"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8080
local_protocol = "http"
upstream_protocol = "https"

# Local D1 database for development
[[d1_databases]]
binding = "DB"
database_name = "placeastro-dev"
database_id = "local"

# Local R2 bucket for development
[[r2_buckets]]
binding = "R2"
bucket_name = "placeastro-dev"

[vars]
CORS_ORIGIN = "http://localhost:3000"
BETTER_AUTH_URL = "http://localhost:3000"
IMGIX_HOSTNAME = "placeastro-dev.imgix.net"
R2_BUCKET = "placeastro-dev"

# Observability for development
[observability]
enabled = false